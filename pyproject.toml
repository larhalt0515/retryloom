[project]
name = "retryloom"
version = "0.1.0"
# Improvement in real agent performance has not been validated.
description = "Experimental local framework for deriving, replaying, evaluating, and applying lessons from agent failure evidence."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3.0",
    "typer>=0.16,<1.0",
    "rich>=13.9,<15.0",
]

[project.scripts]
retryloom = "retryloom.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retryloom"]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/retryloom/**",
    "/tests/**",
    "/tools/controlled_benchmark.py",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.pyo",
    "**/.retryloom/**",
    "**/.reflex/**",
    "**/private/**",
    "**/.env",
    "**/.env.*",
    "**/*.db",
    "**/*.db-*",
    "**/*.sqlite",
    "**/*.sqlite3",
    "**/*.bundle",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
